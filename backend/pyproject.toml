[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "I", "UP"]
# S101: asserts are fine in tests and in the questions self-check
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S603", "S607", "S310", "S110", "B011", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
